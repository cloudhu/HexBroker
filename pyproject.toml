[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexbroker"
version = "0.1.0"
description = "HexFutures-AI：中国商品期货高胜率预测+RL 双层 + 自回归进化研究框架"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2.3,<4",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "pydantic>=2.6",
    "optuna>=3.6",
    "pyarrow>=14.0",
    "matplotlib>=3.9",
    "loguru>=0.7",
    "rich>=13",
    "tqdm>=4.67",
    "lightgbm>=4.5,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "black>=24.1", "mypy>=1.11"]
# torch 上限 <3：env 实测 torch 2.11（RTX 5070 底座）跑 Kronos 微调正常，旧 <2.6 上限过时
torch = ["torch>=2.1,<3"]
# gymnasium 为 stable-baselines3 传递依赖（RL 环境为自研 futures_env，不直接引用）
sb3 = ["stable-baselines3>=2.3,<2.7", "sb3-contrib>=2.3", "gymnasium>=0.29,<1.1"]
# 可选数据源（懒加载：缺依赖不阻断 import，health_check 返回 False / 对应源不可用）
sources = ["akshare", "pytdx", "requests", "tqsdk"]
optional = ["pyqlib", "rqalpha", "vnpy", "mlflow"]

[tool.setuptools]
packages = ["hexbroker"]

[tool.pytest.ini_options]
# 注意：testpaths 是**白名单**，写在列表之外的测试文件会被静默跳过、永不执行
# （2026-08-29：hexbroker/data/test_freshness.py 曾因此被完全跳过）。
# 新增测试目录时必须同步登记此处。
testpaths = ["tests", "hexbroker/data", "hexbroker/data/sources"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

# P1-10 渐进式 lint：首轮仅启用「安全子集」，避免存量代码噪声导致 CI 失败；
# 后续可逐步收紧 select / 收窄 ignore。
[tool.ruff.lint]
select = ["E9", "F", "I001"]
ignore = ["F401", "F811", "F841"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
ignore_missing_imports = true

# P1-10 渐进 strict：
# - 全部 hexbroker.* 先全局忽略错误（存量代码不阻断 CI）；
# - 本批新增模块（factor / market）再开启 --strict 并显式 ignore_errors=false，
#   使增量代码接受严格类型检查，存量代码豁免。后续批次（live/ml/risk）按需纳入 strict 列表。
[[tool.mypy.overrides]]
module = "hexbroker.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["hexbroker.factor", "hexbroker.factor.*", "hexbroker.market", "hexbroker.market.*"]
ignore_errors = false
strict = true
