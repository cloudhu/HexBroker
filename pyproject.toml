[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexbroker"
version = "0.1.0"
description = "HexFutures-AI：中国商品期货高胜率预测+RL 双层 + 自回归进化研究框架"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2.3,<4",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "pydantic>=2.6",
    "optuna>=3.6",
    "pyarrow>=14.0",
    "matplotlib>=3.9",
    "loguru>=0.7",
    "rich>=13",
    "tqdm>=4.67",
    "lightgbm>=4.5,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# torch 上限 <3：env 实测 torch 2.11（RTX 5070 底座）跑 Kronos 微调正常，旧 <2.6 上限过时
torch = ["torch>=2.1,<3"]
# gymnasium 为 stable-baselines3 传递依赖（RL 环境为自研 futures_env，不直接引用）
sb3 = ["stable-baselines3>=2.3,<2.7", "sb3-contrib>=2.3", "gymnasium>=0.29,<1.1"]
optional = ["pyqlib", "rqalpha", "vnpy", "mlflow"]

[tool.setuptools]
packages = ["hexbroker"]

[tool.pytest.ini_options]
testpaths = ["tests", "hexbroker/data/sources"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
ignore_missing_imports = true
