name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps   # 验证打包配置
          # test job 同样需要 ruff：tests/test_audit_ruff_gate.py 的 F821/F811/E9 门禁
          # 属于 pytest 套件的一部分。此前只在 lint job 安装 → test job 上该门禁整条
          # skip（静默失效），且 test_ruff_gate_is_interpreter_agnostic 直接失败。
          pip install ruff
          # czce 官方源单测需要 requests：生产侧为 [sources] extra 懒加载（缺依赖不
          # 阻断 import），但测试 mock requests.get 必须可 import。requests 轻量，
          # 直接安装；akshare/pytdx/tqsdk 等重依赖仍不装（对应源 health_check=False）。
          pip install requests

      - name: Run test suite
        run: |
          python -m pytest

      - name: Static lookahead / recursive self-check (P0-2)
        run: |
          python -m hexbroker.tools.lookahead_analysis hexbroker/feature hexbroker/backtest hexbroker/pipeline.py
          python -m hexbroker.tools.recursive_analysis hexbroker/feature hexbroker/backtest hexbroker/pipeline.py

  lint:
    name: lint (ruff / black / mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps   # 验证打包配置
          pip install ruff black mypy  # P1-10 静态检查工具（dev extra：pip install -e .[dev] 亦可）

      # P1-10：渐进 strict——本批新增模块（factor / market）严格检查，
      # 存量代码经 pyproject [[tool.mypy.overrides]] 豁免；后续批次按需纳入 scope。
      - name: ruff
        run: ruff check hexbroker/factor hexbroker/market

      - name: black
        run: black --check hexbroker/factor hexbroker/market

      - name: mypy
        run: mypy hexbroker/factor hexbroker/market

