# 冠军特征配置 v4（2026-08-16，外盘参照扩展后）
# 在冠军 v3（base 18 + f_range_pos_20 + SPX 组）之上新增 UUP（美元指数代理）组：
#   f_xr_uup_ratio（内盘/美元ETF比值）、f_xr_uup_mom（美元 5 日动量）、
#   f_xr_uup_vol（美元 20 日波动率）
# 消融证据（冠军 v3 基线，全 66 折，调优后 HP）：
#   方向准确率 69.06% -> 70.23% (+1.17pp)；RankIC 0.4390 -> 0.4510 (+0.0120)；
#   coverage 80.79% -> 85.04% (+4.25pp) —— 方向/排序/覆盖三指标全面改善
# 金融逻辑：美元走弱 → 贵金属走强（au/ag 强宏观锚），UUP 为美元指数代理
#   （fxDINIW end 参数不生效仅 2023-12 起，UUP us 前缀可拉全历史且与 DXY 高相关）
# 未采纳：wti(-0.68pp)、ixic(-0.68pp)、dji(-1.66pp)、tlt(-1.08pp)——负贡献
# 数据：data/raw/global/{spx,uup}.parquet（腾讯自选股 MCP，2017-2024，时差安全 shift(1)+asof）
feature:
  transformers: ["technical", "microstructure", "iterative", "cross", "normalize"]
  normalize_window: 120
  technical_params:
    atr_window: 20
    ma_windows: [5, 10, 20, 60]
    rsi_window: 14
  iterative_params:
    include: ["f_range_pos_20"]
  cross_params:
    global_codes: ["spx", "uup"]
