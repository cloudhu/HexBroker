  # ===========================================================================
  # 信号新鲜度门禁（B+C 防再发批次 2026-08-28）
  # 事故背景：阈值=0 的隔夜过期门禁要求每个交易日刷新缓存，漏跑即「系统照常运行
  # 但不交易」（静默停摆）。本段控制启动期硬告警与可选自动刷新。
  # auto_enabled 默认 false：刷新会拉取外部数据并重写缓存，属生产数据操作；
  # 置 true 后启动期自动跑 scripts/p22_tail_ext.py --skip-eval（超时/失败仅告警，不阻断启动）。
  #
  # ⚠️ 层级铁律：本段必须位于 paper: 之下。启动期传入的 paper_cfg 仅为 paper 子段
  # （见 _load_paper_config），顶层同键不会被读到 → 配置静默失效（2026-08-28 缺陷 D1）。
  # cache_paths 留空 = 继承 paper.signal_caches（与 SignalEngine 同口径，缺陷 D2 修复）。
  # ===========================================================================
  signal_refresh:
    threshold: 0                # 交易日 lag>0 即陈旧（与 P3-C 门禁同口径，见 freshness_threshold_trading_days）
    auto_enabled: false         # 默认关：不自动跑 tail_ext
    timeout_sec: 900            # 自动刷新超时保护
    cache_paths: []             # 留空→继承 paper.signal_caches；显式填则覆盖（调试用）
