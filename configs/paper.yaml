# =============================================================================
# 模拟盘交易系统配置（自包含，§7 约定：所有魔法数字进 yaml，代码不写裸阈值）
# 文档：docs/system_design.md（T01 项目基础设施）
# =============================================================================
paper:
  # ---- 资金与预算 ----
  initial_capital: 100000          # 初始资金（元，PRD R4）
  budget_ratio: 0.40               # 单品种保证金预算上限占权益比例（A4）：10 万账户容纳 ag 1 手保证金≈3 万（名义 25 万×12%），单品种集中度上限 40%，预算防线不变
  evaluation_days: 20              # 首轮评估交易日数（Q5 批复）

  # ---- 运行节奏 ----
  poll_interval_sec: 60            # 主循环 tick 轮询间隔（秒）
  intel_interval_sec: 1800         # 情报轮询间隔（秒，30-60 分钟）
  snapshot_interval_sec: 300       # 账户快照落盘间隔（秒）
  open_delay_min: 5                # 开盘后延迟进入分钟数（Q6 批复，跳过集合竞价）
  close_buffer_min: 10             # 收盘复盘触发缓冲：日盘收盘时刻 + N 分钟后（P1-3 修复，不依赖夜盘翻转）

  # ---- 信号（多源级联，按优先序；主源缺失信号时自动回退下一源） ----
  signal_caches:
    - artifacts/signals_cache18_grouped_v8_tail_ext.parquet   # 主源：P22 末折评估窗延长变体（覆盖至 2026-08-28）
    - artifacts/signals_cache18_grouped_v8.parquet            # 兜底：v8 生产基线（止 2026-06-29，fold 边界限制）
  # 信号新鲜度阈值，单位 = **交易日 lag**（P3-C，2026-08-31；口径见 _trading_lag）
  #   lag = idx(R) - idx(信号日)，R = 截至当前时刻市场最新**已收盘**的交易日
  #        （日盘 15:00 前 → R = 上一交易日；夜盘 15:00 后 → R = 当日，若当日已在日历中）
  #   0  = 信号覆盖最近一个已收盘交易日（标准 T+1）→ 放行
  #        （周一用周五信号、假期后首日用节前信号，均 lag=0 放行）
  #   负数 = 信号比标准 T+1 更新 → 放行（保留符号，勿取绝对值）
  #   ≥1  = 缓存停更 N 个交易日 → 过期 → 技术兜底/禁开+告警（§8.2）
  #
  # ⛔ 口径已两度变更，勿回退（全历史实测健康态误拦率，rb0 2097 天样本）：
  #   P0-3 工作日差/阈值0 → 盘中 lag 恒≥1，等价于「日盘永不主源开仓」
  #   P3-B 自然日差/阈值1 → 周一+假期后首日误拦 448 天 = 21.36%（结构性，逐年稳定）
  #   P3-C 交易日历 lag/阈值0 → 误拦 0 天 = 0.00%，停更 1 日即拦 ✅
  # 复跑验证：scripts/verify_freshness_caliber_options.py --full-history
  #
  # ⚠️ 此处的 0 与 P0-3 的 0 语义不同：本口径下盘中 lag 可达 0（= 标准 T+1）。
  # ⛔ 已废弃键 freshness_threshold_days（自然日差口径）不得复用。
  freshness_threshold_trading_days: 0
  technical:                       # 技术指标兜底参数（§8.1 c0 信号缺口）
    fast_ma: 5
    slow_ma: 20
    atr_window: 14
    atr_mult: 1.5

  # ---- 风控（复用 configs/risk/v4_atr.yaml 语义/R6；按 10 万账户规模调参） ----
  risk_config: configs/risk/v4_atr.yaml
  risk_hard_stop: 0.20             # 组合硬止损回撤阈值（默认 0.20）
  # 风控参数覆盖：v4_atr 语义不变（硬止损>S1-S5>预算>恢复>意图），仅将参数
  # 从 100 万回测账户标定调整到 10 万模拟账户（否则预算≤8% 永远买不起 1 手）
  risk_overrides:
    vol_target: 0.30
    kelly_cap: 1.0
    max_position_pct: 0.50
  risk_default_intent: 0.30        # 信号→意图仓位（风控再封顶）
  risk_default_vol: 0.02           # 无 K 线时 realized_vol 近似
  risk_vol_quantile: 0.5           # ATR 档位波动分位
  default_atr_pct: 0.01            # 无 K 线时 ATR 近似（价格比例）
  risk_reward_ratio: 1.5           # 止盈/止损距离比（计划止盈用）

  # ---- 成本模型（与 SimBroker/CostModel 口径一致，PRD R4） ----
  cost:
    fee_rate_open: 0.00005
    fee_rate_close: 0.00005
    fee_rate_close_today: 0.00010
    slippage_ticks: 1
    margin_rate: 0.12
    multiplier: 10.0
    min_tick: 10.0

  # ---- P0-1 开仓成本门禁（净期望收益 > 往返成本 × min_ratio 才开仓） ----
  # 消费信号帧中的 exp_ret（原为死字段）：expected_pnl = direction×exp_ret/100×notional；
  # round_trip_cost = 手续费部分 + 滑点部分（R3）：notional×(fee_open+fee_close_today)
  #   + 2×min_tick×slippage_ticks×multiplier（滑点参数取自 cost 段，slipage_in_cost=false 时按纯费口径）；
  # 同时校验 p_up 方向与 exp_ret 符号一致。
  risk_gate:
    cost_gate_enabled: true
    cost_gate_min_ratio: 2.0
    slippage_in_cost: true           # R3：往返成本口径纳入滑点（默认 true）

  # ---- P2-2 最小持仓时长（今平节奏控制，不改动费率模型 fee_rate_close_today） ----
  # 持仓不足 N 分钟且为今平（当日新开）时拦截平今，从节奏降今平频率；0=关闭(默认)
  min_hold_minutes: 0

  # ---- P0-2 信号无变化冷却（消除 60s 开-平-开-平循环） ----
  # 信号指纹 (p_up, exp_ret, source) 与上一轮实际开仓相同 → 即使风控返回开仓意图也跳过；
  # 已有持仓的风控动作（止损/止盈/S1-S5）不受影响；source 不同即视为信号变化。
  #
  # ---- P0-1（2026-09-01）指纹生命周期：TTL + 当日重开预算 + 跨窗口持久化 ----
  # 取证：rb0 在 08-31 夜盘停摆 1.94h（117 次拦截）、09-01 日盘停摆 2.36h（127 次拦截）。
  # 根因：信号缓存日内恒定 → 指纹永不变化 → 一旦平仓，冷却退化为「当日永不再开」。
  #   ① ttl_minutes：同指纹「上次开仓 → 再次开仓」的最小间隔，到期即放行。
  #      ⛔ 不可设 0 —— 那等于退回 P0-2 之前的 60s 开-平-开-平循环。
  #   ② max_reentries_per_day：TTL 到期后的第二道闸，同一交易日同一指纹最多重开 N 次
  #      （0 = 不限制）。只加 TTL 会让 60s 循环以 TTL 为周期复活，预算是硬顶。
  #      注意计数按**交易日标签**（夜盘 21:00 后归属下一交易日），不使用自然日。
  #   ③ persist：跨三窗口重启（08:55/13:25/20:55）持久化指纹与重开计数。
  #      ⛔ 不可关 —— 一天三次重启 = 三次「免费重开」，TTL 形同虚设。
  signal_cooldown:
    enabled: true
    p_up_tol: 0.01
    exp_ret_tol: 0.001
    ttl_minutes: 30
    max_reentries_per_day: 3
    persist: true

  # ---- 落盘路径 ----
  data_dir: data/paper
  plans_dir: trade_plans
  reports_dir: deliverables
  account_file: data/paper/account.json
  # P0-1 信号冷却状态（指纹 / 开仓时刻 / 交易日 / 当日重开计数），跨三窗口重启续跑
  cooldown_file: data/paper/cooldown.json
  trades_log: data/paper/trades.log
  c0_daily_csv: data/paper/c0_daily.csv
  intel_static_file: data/paper/news_static.json   # 静态情报源（MCP 文件桥接：agent 用 mx-ds-mcp 拉取落盘 JSON）

  # ---- 行情 ----
  quote_url: https://hq.sinajs.cn/list=
  quote_timeout_sec: 10
  bar_freq: 1d                     # 技术兜底 K 线频率
  bar_days: 120                    # 技术兜底 K 线天数
  # P0-2 行情缺失熔断阈值：行情拉取连续失败（网络异常 getaddrinfo / 全部品种 price<=0 或无报价）
  # 达到该次数 → 进入 HALT 态（停止开仓 + 告警 + 禁止用缓存价撮合）；任意一次成功取数（≥1 有效品种）即复位解除。
  quote_fail_halt_threshold: 5
  # P2-3 报价时效（秒）：单报价年龄=now-ts 超此值视为过期拒绝撮合（与 P0-2 HALT 互补）
  quote_max_age_sec: 180        # 默认 3×poll_interval

  # ---- 品种（主力连续 + 换月；c0 参数显式声明，不在 CONTRACTS18 内） ----
  symbols:
    ag0:
      display: SHFE.ag
      sina_code: nf_AG0
      multiplier: 15
      min_tick: 1.0                 # 上期所白银最小变动价位 1 元/千克（2026-08-30 修正：
                                    # 旧值 0.01 致滑点成本低估 100 倍；tqsdk 真行情
                                    # 300 根 + 主湖历史价均为 1.0 整数倍双证）
      mode: trade                  # trade=完整启用（v8 信号+实时行情）
      sessions:
        day: [["09:00","10:15"],["10:30","11:30"],["13:30","15:00"]]
        night: [["21:00","02:30"]]
    rb0:
      display: SHFE.rb
      sina_code: nf_RB0
      multiplier: 10
      min_tick: 1
      mode: trade
      sessions:
        day: [["09:00","10:15"],["10:30","11:30"],["13:30","15:00"]]
        night: [["21:00","23:00"]]
    c0:
      display: DCE.c
      sina_code: nf_C0
      multiplier: 10
      min_tick: 1
      mode: accumulate             # accumulate=日线积累渐进启用（c0 决策，§8.1）
      accumulate_days: 30          # 满 30 个交易日后自动切换 trade
      sessions:
        day: [["09:00","10:15"],["10:30","11:30"],["13:30","15:00"]]
        night: []

  # ---- 2026 节假日表（交易所休市日；以交易所当年公告为准，上线前人工核对一次，§8.5） ----
  holidays_2026:
    # 元旦（1/1-1/3）
    - "2026-01-01"
    - "2026-01-02"
    - "2026-01-03"
    # 春节（2/15-2/22，除夕 2/16）
    - "2026-02-16"
    - "2026-02-17"
    - "2026-02-18"
    - "2026-02-19"
    - "2026-02-20"
    - "2026-02-21"
    - "2026-02-22"
    # 清明（4/4-4/6）
    - "2026-04-06"
    # 劳动节（5/1-5/5）
    - "2026-05-01"
    - "2026-05-04"
    - "2026-05-05"
    # 端午（6/19-6/21）
    - "2026-06-19"
    # 中秋（9/25-9/27）
    - "2026-09-25"
    # 国庆（10/1-10/7）
    - "2026-10-01"
    - "2026-10-02"
    - "2026-10-05"
    - "2026-10-06"
    - "2026-10-07"

  # ---- 情报（Q3 批复：P1 仅风险提示+计划备注） ----
  intel:
    http:                            # HTTP 真实情报源（东财公开 API；MCP 替代，自包含零依赖）
      enabled: true
      timeout_sec: 10
    keywords:
      ag0: [沪银, 白银, 银价, 贵金属]
      rb0: [螺纹, 螺纹钢, 钢材, 铁矿, 黑色系]
      c0: [玉米, 玉米淀粉, 农产品]
    risk_keywords: [风险, 下跌, 上涨, 暴涨, 暴跌, 涨停, 跌停, 限产, 抛储, 政策, 关税, 制裁, 出口, 库存]

  # ===========================================================================
  # 信号新鲜度门禁（B+C 防再发批次 2026-08-28）
  # 事故背景：阈值=0 的隔夜过期门禁要求每个交易日刷新缓存，漏跑即「系统照常运行
  # 但不交易」（静默停摆）。本段控制启动期硬告警与可选自动刷新。
  # auto_enabled 默认 false：刷新会拉取外部数据并重写缓存，属生产数据操作；
  # 置 true 后启动期自动跑 scripts/p22_tail_ext.py --skip-eval（超时/失败仅告警，不阻断启动）。
  #
  # ⚠️ 层级铁律：本段必须位于 paper: 之下。启动期传入的 paper_cfg 仅为 paper 子段
  # （见 _load_paper_config），顶层同键不会被读到 → 配置静默失效（2026-08-28 缺陷 D1）。
  # cache_paths 留空 = 继承 paper.signal_caches（与 SignalEngine 同口径，缺陷 D2 修复）。
  # ===========================================================================
  signal_refresh:
    threshold: 0                # 交易日 lag>0 即陈旧（与 P3-C 门禁同口径，见 freshness_threshold_trading_days）
    auto_enabled: false         # 默认关：不自动跑 tail_ext
    timeout_sec: 900            # 自动刷新超时保护
    cache_paths: []             # 留空→继承 paper.signal_caches；显式填则覆盖（调试用）
