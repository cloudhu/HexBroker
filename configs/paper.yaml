# =============================================================================
# 模拟盘交易系统配置（自包含，§7 约定：所有魔法数字进 yaml，代码不写裸阈值）
# 文档：docs/system_design.md（T01 项目基础设施）
# =============================================================================
paper:
  # ---- 资金与预算 ----
  initial_capital: 100000          # 初始资金（元，PRD R4）
  budget_ratio: 0.40               # 单品种保证金预算上限占权益比例（A4）：10 万账户容纳 ag 1 手保证金≈3 万（名义 25 万×12%），单品种集中度上限 40%，预算防线不变
  evaluation_days: 20              # 首轮评估交易日数（Q5 批复）

  # ---- 运行节奏 ----
  poll_interval_sec: 60            # 主循环 tick 轮询间隔（秒）
  intel_interval_sec: 1800         # 情报轮询间隔（秒，30-60 分钟）
  snapshot_interval_sec: 300       # 账户快照落盘间隔（秒）
  open_delay_min: 5                # 开盘后延迟进入分钟数（Q6 批复，跳过集合竞价）
  close_buffer_min: 10             # 收盘复盘触发缓冲：日盘收盘时刻 + N 分钟后（P1-3 修复，不依赖夜盘翻转）

  # ---- 信号（多源级联，按优先序；主源缺失信号时自动回退下一源） ----
  signal_caches:
    - artifacts/signals_cache18_grouped_v8_tail_ext.parquet   # 主源：P22 末折评估窗延长变体（覆盖至 2026-08-28）
    - artifacts/signals_cache18_grouped_v8.parquet            # 兜底：v8 生产基线（止 2026-06-29，fold 边界限制）
  # 信号新鲜度阈值，单位 = **交易日 lag**（P3-C，2026-08-31；口径见 _trading_lag）
  #   lag = idx(R) - idx(信号日)，R = 截至当前时刻市场最新**已收盘**的交易日
  #        （日盘 15:00 前 → R = 上一交易日；夜盘 15:00 后 → R = 当日，若当日已在日历中）
  #   0  = 信号覆盖最近一个已收盘交易日（标准 T+1）→ 放行
  #        （周一用周五信号、假期后首日用节前信号，均 lag=0 放行）
  #   负数 = 信号比标准 T+1 更新 → 放行（保留符号，勿取绝对值）
  #   ≥1  = 缓存停更 N 个交易日 → 过期 → 技术兜底/禁开+告警（§8.2）
  #
  # ⛔ 口径已两度变更，勿回退（全历史实测健康态误拦率，rb0 2097 天样本）：
  #   P0-3 工作日差/阈值0 → 盘中 lag 恒≥1，等价于「日盘永不主源开仓」
  #   P3-B 自然日差/阈值1 → 周一+假期后首日误拦 448 天 = 21.36%（结构性，逐年稳定）
  #   P3-C 交易日历 lag/阈值0 → 误拦 0 天 = 0.00%，停更 1 日即拦 ✅
  # 复跑验证：scripts/verify_freshness_caliber_options.py --full-history
  #
  # ⚠️ 此处的 0 与 P0-3 的 0 语义不同：本口径下盘中 lag 可达 0（= 标准 T+1）。
  # ⛔ 已废弃键 freshness_threshold_days（自然日差口径）不得复用。
  freshness_threshold_trading_days: 0
  technical:                       # 技术指标兜底参数（§8.1 c0 信号缺口）
    fast_ma: 5
    slow_ma: 20
    atr_window: 14
    atr_mult: 1.5

  # ---- 风控（复用 configs/risk/v4_atr.yaml 语义/R6；按 10 万账户规模调参） ----
  risk_config: configs/risk/v4_atr.yaml
  risk_hard_stop: 0.20             # 组合硬止损回撤阈值（默认 0.20）
  # 风控参数覆盖：v4_atr 语义不变（硬止损>S1-S5>预算>恢复>意图），仅将参数
  # 从 100 万回测账户标定调整到 10 万模拟账户（否则预算≤8% 永远买不起 1 手）
  risk_overrides:
    vol_target: 0.30
    kelly_cap: 1.0
    max_position_pct: 0.50
  risk_default_intent: 0.30        # 信号→意图仓位（风控再封顶）
  risk_default_vol: 0.02           # 无 K 线时 realized_vol 近似
  risk_vol_quantile: 0.5           # ATR 档位波动分位
  default_atr_pct: 0.01            # 无 K 线时 ATR 近似（价格比例）
  risk_reward_ratio: 1.5           # 止盈/止损距离比（计划止盈用）

  # ---- P0-C 止损止盈影子模式（2026-09-04）----
  # 背景：2026-09-04 源码级取证确认，PaperBroker 维护了每品种 _stops / _take_profits
  #   档位，但全仓**从未有任何一处拿现价与它们比较过** —— 计划止损/止盈只被写进
  #   日志与 account.json 展示，从未参与执行（P0-2）。
  # 本开关先补上「判定」这一步，但**不接线执行**：
  #   true （默认/推荐）→ 影子模式：命中只打 [SHADOW-STOP]/[SHADOW-TP] 告警 +
  #        写 data/paper/shadow_stops.jsonl，账户状态零变更；
  #   false            → 真实平仓：命中即将该品种平至 0（代码已实现，只待观察期满）。
  # ⛔ 转 false 前必须完成观察期评估（触发频率 / 触发时浮盈分布 / 与风控重叠度），
  #    详见交付报告「影子模式观察指标」一节。
  risk:
    shadow_stops: true
    # 任务B 跨日滚动极值（2026-09-04 / 名实不符语义债修复）：
    #   PositionCtx.highest/lowest_since_entry 原实现取**当日** quote.high/low（最高点
    #   只到"今日或开仓"，跨日持仓时昨日极值丢失），变量名却叫 *_since_entry → 名实不符。
    #   true → 启用持仓以来**跨日滚动**极值（状态随 account.json additive 键持久化）；
    #   false（默认）= 维持现状当日口径，行为零变化。
    #   ⛔ 实证：risk 引擎 S1–S5 / trailing / ratchet / 硬止损当前**均不读取**这两个字段
    #     （观察/审计用），故开 true **不改变任何触发点**；留开关为将来规则闸语义。
    cross_day_rolling_extremes: false

  # ---- P0-4（2026-09-01）仓位粒度放大防护 ----
  # 背景：期货最小交易单位是 1 手 → 风控批准 0.4454 手只能实开 1 手，名义敞口
  #   被放大（rb0 意图 15% → 33.46% 权益，2.23×；ag0 意图 30% → **256.86%**，8.56×）；
  #   而 broker 第二道防线按**保证金**把关（ag0 保证金仅占 ~31%，预算 40% 内放行），
  #   既兜不住名义敞口，也兜不住单笔风险。
  # ⛔ 危害窗口：ag0 只在意图 ≥ ~25.8% 时才被放大（15% 时 raw=0.058 < 0.10 阈值
  #   直接不开仓），而 risk_default_intent=0.30 恰在区间内 —— 只看 15% 会漏掉真危害。
  # 解法：以「单笔止损亏损 ≤ 本品种预算 × 权益」反推手数（风险预算法），
  #   绕开「名义敞口 vs 最小 1 手」的死结 —— 只拦真正风险过大的品种。
  #   实测（equity 94,868，止损 2.5×ATR）：ag0 1 手风险 24.89% 权益 → 0 手；
  #   rb0 0.86% → 1 手；c0 0.59% → 1 手（后两者与现状完全一致）。
  # 裁决：D1=B（启用）+ D2=C（按品种设预算），2026-09-01 主理人核准。
  size_by_risk: true
  risk_per_trade: 0.01             # 单笔可承受亏损占权益比例（1% = 948 元 @10 万）
  risk_stop_atr_mult: 2.5          # 无 stop_price 时的兜底止损距离倍率（= ATRTier.HIGH 最宽档）
  # D2-C 按品种覆盖（未列出者沿用 risk_per_trade）。不同品种「1 手」的绝对风险
  # 差一个数量级，一把尺子量到底必然是「要么全放行、要么拦死某品种」。
  risk_per_trade_by_symbol:
    # ⛔ ag0 属**结构性不可交易**，不是参数没调好：1 手风险 24.89% 权益由
    #   合约乘数 15× 与最小 1 手共同决定。任何 <24.89% 的预算都会拦它；
    #   把预算抬到 25% 则等于放弃风控（连亏 4 次归零）。
    #   要在 1% 风险下开 1 手 ag0，**需权益 ≈ 236 万**（当前 9.5 万）。
    #   此处显式写 0.01（=全局值）是**固化意图**：将来加资金时改这里，
    #   而不是让人对着「ag0 怎么老不开仓」重新推一遍。
    ag0: 0.01

  # ---- P1（2026-09-02）权益自适应可交易门槛 ----
  # 背景：上面说的「结构性不可交易」其实是**全品种通病**，不是 ag0 独有。
  #   ⛔ 口径警告（2026-09-02 QA 复核后修正）：下面这张 18 品种表是**回测研究口径**
  #   （CONTRACTS18 = data/raw/processed/ 下全部品种），**不是生产在跑的宇宙**。
  #   生产宇宙以本文件 symbols: 为准，只有 ag0 / rb0 / c0 三个。两侧存在错位：
  #     · hc0 在研究宇宙，但**不在生产宇宙**
  #     · c0  在生产宇宙，但**不在 CONTRACTS18、也不在主湖 parquet**
  #       （data/raw/processed/ 无 c0 目录，历史行情只能取实时源）
  #   —— 生产宇宙实测（同口径 equity 94,857 / 2.5×ATR / 1% 预算）：
  #     rb0  风险 0.84%  保证金  4.02%  门槛  7.9 万（0.84×）→ ✅ 可交易
  #     c0   风险 0.59%  保证金  2.91%  门槛  5.6 万（0.59×）→ ✅ 可交易
  #     ag0  风险 24.31% 保证金 30.83%  门槛 230.6 万（24.31×）→ ⛔ 结构性
  #   即**生产 3 品种中 2 个可交易**，只有 ag0 被结构性拦下。
  #   （研究口径门槛权益升序，仅供扩容评估：hc0 7.3 < rb0 7.9 < m0 11.2 < sr0 14.3
  #     < y0 25.8 < cf0 29.0 < i0 31.4 < al0 32.4 < p0 37.7 < ta0 42.5 < zn0 50.6
  #     < ni0 60.7 < jm0 85.3 < cu0 141.7 < j0 154.3 < ag0 230.6 < au0 462.1
  #     < sc0 605.1 万）
  # 机制：门槛权益 / 当前权益 >= 此值 → 判定「结构性不可交易」，拦截日志**按日去重
  #   降级为 INFO**（仍是 observe_only：信号照出、IC 照算、不开仓），避免每轮刷屏
  #   淹没真实告警（行情故障 / 信号缺失 / 边缘品种拦截）。
  # 效果：**本金一涨，品种自动解锁**，无需每次改白名单或改配置。
  # 当前生产宇宙里只有 ag0（24.31×）被降级；rb0/c0 均 <1×，完全不受影响。
  # ⛔ 本项只控制**日志级别**，**不改变是否开仓**（手数仍由风险预算/保证金决定）。
  # 设为 0 可关闭降级（全部按普通拦截告警）。
  struct_untradeable_ratio: 3.0

  # ---- P1-C（2026-09-02）名义硬顶 → 保证金硬顶 ----
  # max_position_pct 是**名义价值**口径，对带杠杆的期货**根本错配**：
  #   名义口径下 18 个品种仅 3 个达标，保证金口径下 15 个达标。
  #   且它**设计上仅告警、不拦截**（见 scripts/paper_trading_main.py::_max_position_pct）。
  # 故另设保证金口径硬顶并让它**真正生效**，与 broker 第一道防线（budget_ratio）
  # 同口径。0.20 = 行业实践的「单品种保证金占用 ≤10%–20%」上限。
  # ⛔ 注意：broker 的 budget_ratio(0.40) 是**全组合**口径，这里是**单品种**口径，
  #   两者叠加生效（先过 planner 的 20%，再过 broker 的 40%）。
  max_margin_pct: 0.20

  # ---- 成本模型（与 SimBroker/CostModel 口径一致，PRD R4） ----
  cost:
    fee_rate_open: 0.00005
    fee_rate_close: 0.00005
    fee_rate_close_today: 0.00010
    slippage_ticks: 1
    margin_rate: 0.12
    multiplier: 10.0
    min_tick: 10.0

  # ---- P0-1 开仓成本门禁（净期望收益 > 往返成本 × min_ratio 才开仓） ----
  # 消费信号帧中的 exp_ret（原为死字段）：expected_pnl = direction×exp_ret/100×notional；
  # round_trip_cost = 手续费部分 + 滑点部分（R3）：notional×(fee_open+fee_close_today)
  #   + 2×min_tick×slippage_ticks×multiplier（滑点参数取自 cost 段，slipage_in_cost=false 时按纯费口径）；
  # 同时校验 p_up 方向与 exp_ret 符号一致。
  risk_gate:
    cost_gate_enabled: true
    cost_gate_min_ratio: 2.0
    slippage_in_cost: true           # R3：往返成本口径纳入滑点（默认 true）

  # ---- P2-2 最小持仓时长（今平节奏控制，不改动费率模型 fee_rate_close_today） ----
  # 持仓不足 N 分钟且为今平（当日新开）时拦截平今，从节奏降今平频率；0=关闭(默认)
  min_hold_minutes: 0

  # ---- P0-2 信号无变化冷却（消除 60s 开-平-开-平循环） ----
  # 信号指纹 (p_up, exp_ret, source) 与上一轮实际开仓相同 → 即使风控返回开仓意图也跳过；
  # 已有持仓的风控动作（止损/止盈/S1-S5）不受影响；source 不同即视为信号变化。
  #
  # ---- P0-1（2026-09-01）指纹生命周期：TTL + 当日重开预算 + 跨窗口持久化 ----
  # 取证：rb0 在 08-31 夜盘停摆 1.94h（117 次拦截）、09-01 日盘停摆 2.36h（127 次拦截）。
  # 根因：信号缓存日内恒定 → 指纹永不变化 → 一旦平仓，冷却退化为「当日永不再开」。
  #   ① ttl_minutes：同指纹「上次开仓 → 再次开仓」的最小间隔，到期即放行。
  #      ⛔ 不可设 0 —— 那等于退回 P0-2 之前的 60s 开-平-开-平循环。
  #   ② max_reentries_per_day：TTL 到期后的第二道闸，同一交易日同一指纹最多重开 N 次
  #      （0 = 不限制）。只加 TTL 会让 60s 循环以 TTL 为周期复活，预算是硬顶。
  #      注意计数按**交易日标签**（夜盘 21:00 后归属下一交易日），不使用自然日。
  #   ③ persist：跨三窗口重启（08:55/13:25/20:55）持久化指纹与重开计数。
  #      ⛔ 不可关 —— 一天三次重启 = 三次「免费重开」，TTL 形同虚设。
  signal_cooldown:
    enabled: true
    p_up_tol: 0.01
    exp_ret_tol: 0.001
    ttl_minutes: 30
    max_reentries_per_day: 3
    persist: true

  # ---- 落盘路径 ----
  data_dir: data/paper
  plans_dir: trade_plans
  reports_dir: deliverables
  account_file: data/paper/account.json
  # P0-1 信号冷却状态（指纹 / 开仓时刻 / 交易日 / 当日重开计数），跨三窗口重启续跑
  cooldown_file: data/paper/cooldown.json
  trades_log: data/paper/trades.log
  c0_daily_csv: data/paper/c0_daily.csv
  # P1-4（2026-09-04）：c0 日内积累中间态 json——采集进程每 tick 原子写，
  # 收盘复盘（20:5x 新进程无当日盘中数据）启动时 load 恢复 → c0_daily.csv 可生成、
  # accumulate 30 日毕业从死代码复活。属运行时中间态（非 git 跟踪），勿提交。
  c0_intraday_file: data/paper/c0_intraday.json
  intel_static_file: data/paper/news_static.json   # 静态情报源（MCP 文件桥接：agent 用 mx-ds-mcp 拉取落盘 JSON）

  # ---- 行情 ----
  quote_url: https://hq.sinajs.cn/list=
  quote_timeout_sec: 10
  bar_freq: 1d                     # 技术兜底 K 线频率
  bar_days: 120                    # 技术兜底 K 线天数
  # P0-2 行情缺失熔断阈值：行情拉取连续失败（网络异常 getaddrinfo / 全部品种 price<=0 或无报价）
  # 达到该次数 → 进入 HALT 态（停止开仓 + 告警 + 禁止用缓存价撮合）；任意一次成功取数（≥1 有效品种）即复位解除。
  quote_fail_halt_threshold: 5
  # P2-3 报价时效（秒）：单报价年龄=now-ts 超此值视为过期拒绝撮合（与 P0-2 HALT 互补）
  quote_max_age_sec: 180        # 默认 3×poll_interval

  # ---- 品种（主力连续 + 换月；c0 参数显式声明，不在 CONTRACTS18 内） ----
  symbols:
    ag0:
      display: SHFE.ag
      sina_code: nf_AG0
      multiplier: 15
      min_tick: 1.0                 # 上期所白银最小变动价位 1 元/千克（2026-08-30 修正：
                                    # 旧值 0.01 致滑点成本低估 100 倍；tqsdk 真行情
                                    # 300 根 + 主湖历史价均为 1.0 整数倍双证）
      mode: trade                  # trade=完整启用（v8 信号+实时行情）
      sessions:
        day: [["09:00","10:15"],["10:30","11:30"],["13:30","15:00"]]
        night: [["21:00","02:30"]]
    rb0:
      display: SHFE.rb
      sina_code: nf_RB0
      multiplier: 10
      min_tick: 1
      mode: trade
      sessions:
        day: [["09:00","10:15"],["10:30","11:30"],["13:30","15:00"]]
        night: [["21:00","23:00"]]
    c0:
      display: DCE.c
      sina_code: nf_C0
      multiplier: 10
      min_tick: 1
      mode: accumulate             # accumulate=日线积累渐进启用（c0 决策，§8.1）
      accumulate_days: 30          # 满 30 个交易日后自动切换 trade
      sessions:
        day: [["09:00","10:15"],["10:30","11:30"],["13:30","15:00"]]
        night: []

  # ---- 2026 节假日表（交易所休市日；以交易所当年公告为准，上线前人工核对一次，§8.5） ----
  holidays_2026:
    # 元旦（1/1-1/3）
    - "2026-01-01"
    - "2026-01-02"
    - "2026-01-03"
    # 春节（2/15-2/22，除夕 2/16）
    - "2026-02-16"
    - "2026-02-17"
    - "2026-02-18"
    - "2026-02-19"
    - "2026-02-20"
    - "2026-02-21"
    - "2026-02-22"
    # 清明（4/4-4/6）
    - "2026-04-06"
    # 劳动节（5/1-5/5）
    - "2026-05-01"
    - "2026-05-04"
    - "2026-05-05"
    # 端午（6/19-6/21）
    - "2026-06-19"
    # 中秋（9/25-9/27）
    - "2026-09-25"
    # 国庆（10/1-10/7）
    - "2026-10-01"
    - "2026-10-02"
    - "2026-10-05"
    - "2026-10-06"
    - "2026-10-07"

