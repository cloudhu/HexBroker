<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="864" viewBox="0 0 1080 864">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="864" fill="url(#bg)"/>
  
  <!-- Grid lines (subtle) -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="216" x2="1080" y2="216"/>
    <line x1="0" y1="432" x2="1080" y2="432"/>
    <line x1="0" y1="648" x2="1080" y2="648"/>
    <line x1="270" y1="0" x2="270" y2="864"/>
    <line x1="540" y1="0" x2="540" y2="864"/>
    <line x1="810" y1="0" x2="810" y2="864"/>
  </g>
  
  <!-- Chart line -->
  <path d="M 100 600 Q 200 580 300 500 Q 400 420 500 380 Q 600 350 700 300 Q 800 280 900 200 L 980 180"
        fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Chart dots -->
  <circle cx="300" cy="500" r="6" fill="#e94560"/>
  <circle cx="500" cy="380" r="6" fill="#e94560"/>
  <circle cx="700" cy="300" r="6" fill="#e94560"/>
  <circle cx="900" cy="200" r="8" fill="#ff6b6b"/>
  
  <!-- Title area -->
  <text x="540" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">
    云侠 AI 量化交易
  </text>
  
  <!-- Subtitle -->
  <text x="540" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#aaaacc">
    智能投研 · 量化策略 · 自动执行
  </text>
  
  <!-- Bottom bar -->
  <rect x="0" y="820" width="1080" height="44" fill="url(#accent)" fill-opacity="0.3"/>
  <text x="540" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">
    ⚠️ 模拟盘·AI生成·不构成投资建议·投资有风险·入市需谨慎
  </text>
  
  <!-- Decorative elements -->
  <rect x="80" y="160" width="3" height="40" fill="#e94560"/>
  <rect x="997" y="160" width="3" height="40" fill="#e94560"/>
</svg>
